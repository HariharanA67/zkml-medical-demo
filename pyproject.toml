[project]
name = "zkml-engine"
version = "0.1.0"
description = "Zero-Knowledge Machine Learning (zkML) Inference Engine on EVM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "tabulate>=0.10.0",
    "torch>=2.4.0",
    "streamlit>=1.66.0",
    "web3>=8.0.0",
    "py-solc-x>=2.0.5",
    "python-dotenv>=1.2.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
